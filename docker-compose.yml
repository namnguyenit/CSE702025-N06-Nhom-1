version: '3.9'
services:
  mongo1:
    image: mongo:latest
    container_name: mongo1
    hostname: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo1_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo2:
    image: mongo:latest
    container_name: mongo2
    hostname: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo3:
    image: mongo:latest
    container_name: mongo3
    hostname: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo3_data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-setup:
    image: mongo:latest
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    entrypoint: >
      bash -c "\
        sleep 10; \
        echo '--- INIT REPLICA SET ---'; \
        mongosh --host mongo1:27017 --eval '\
          try { \
            var status = rs.status(); \
            if (status.ok === 0 || status.code === 94) { \
              rs.initiate({ \
                _id: \"rs0\", \
                members: [ \
                  { _id: 0, host: \"mongo1:27017\" }, \
                  { _id: 1, host: \"mongo2:27017\" }, \
                  { _id: 2, host: \"mongo3:27017\" } \
                ] \
              }); \
              print(\"Replica set initiated\"); \
            } else { \
              print(\"Replica set already initialized\"); \
            } \
          } catch(e) { \
            if (e.code === 94) { \
              rs.initiate({ \
                _id: \"rs0\", \
                members: [ \
                  { _id: 0, host: \"mongo1:27017\" }, \
                  { _id: 1, host: \"mongo2:27017\" }, \
                  { _id: 2, host: \"mongo3:27017\" } \
                ] \
              }); \
              print(\"Replica set initiated\"); \
            } else { \
              print(\"Error: \" + e); \
            } \
          } \
        '; \
      "
    networks:
      - backend

  user1:
    build: ./user
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/webbtl?replicaSet=rs0
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - backend
  user2:
    build: ./user
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/webbtl?replicaSet=rs0
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - backend
  user3:
    build: ./user
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/webbtl?replicaSet=rs0
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - backend
  user4:
    build: ./user
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/webbtl?replicaSet=rs0
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - backend
  user5:
    build: ./user
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/webbtl?replicaSet=rs0
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - backend

  admin:
    build: ./admin
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGODB_URI=mongodb://mongo1:27017,mongo2:27017,mongo3:27017/webbtl?replicaSet=rs0
    depends_on:
      mongo-setup:
        condition: service_completed_successfully
    networks:
      - backend

  nginx:
    image: nginx:1.25
    container_name: nginx
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user1
      - user2
      - user3
      - user4
      - user5
    networks:
      - backend

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:

networks:
  backend:
    driver: bridge
